services:
  - type: web
    name: payment-gateway-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: payment-gateway-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://swipswaps.github.io
      - key: PYTHON_VERSION
        value: 3.10.12
  - type: redis
    name: payment-gateway-redis
    plan: free
    ipAllowList: []
